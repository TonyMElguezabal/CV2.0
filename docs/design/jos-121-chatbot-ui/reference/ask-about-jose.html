<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask about Jose</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050810;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }

  /* ---- The chat widget ---- */
  .chat-widget {
    width: 380px;
    max-width: 100%;
    /* green gradient matched to the bot icon (bright green -> deep green) */
    background: linear-gradient(180deg, #0d7a3a 0%, #086b34 45%, #00522f 100%);
    border: 1px solid rgba(0,0,0,0.25);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.55);
  }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.18);
  }
  .chat-header h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
  }
  .chat-header .close {
    background: none;
    border: none;
    color: rgba(255,255,255,0.7);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
  }

  .chat-body {
    padding: 22px 20px 20px;
  }

  /* ---- Animated saluting bot (two layers: body + swinging arm) ---- */
  .bot-wrap {
    position: relative;
    width: fit-content;
    margin: 2px auto 16px;      /* space between header and greeting */
  }
  .bot-wrap img {
    display: block;
    height: 132px;              /* bot size */
    width: auto;
  }
  .bot-arm {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 27.3% 54.1%;   /* shoulder pivot */
    animation: bot-salute 4.5s ease-in-out infinite;
  }
  @keyframes bot-salute {
    0%, 8%   { transform: rotate(0deg); }
    22%      { transform: rotate(115deg); }   /* raise up beside head */
    30%      { transform: rotate(100deg); }   /* wave */
    38%      { transform: rotate(118deg); }
    46%      { transform: rotate(102deg); }
    54%      { transform: rotate(115deg); }
    70%      { transform: rotate(112deg); }   /* hold the salute */
    84%,100% { transform: rotate(0deg); }     /* lower + rest */
  }
  @media (prefers-reduced-motion: reduce) {
    .bot-arm { animation: none; }
  }

  .greeting {
    margin: 0 0 20px;
    color: #ffffff;
    font-size: 17px;
    line-height: 1.5;
    text-align: left;
  }

  .suggestion {
    width: 100%;
    text-align: left;
    background: rgba(255,255,255,0.08);
    color: #ffffff;
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 12px;
    padding: 15px 16px;
    font-size: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .suggestion:hover {
    background: rgba(255,255,255,0.16);
    border-color: rgba(255,255,255,0.45);
  }

  .chat-input-row {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 16px 20px;
    border-top: 1px solid rgba(255,255,255,0.18);
  }
  .chat-input-row input {
    flex: 1;
    background: rgba(0,0,0,0.18);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 999px;
    padding: 14px 18px;
    color: #ffffff;
    font-size: 16px;
    outline: none;
  }
  .chat-input-row input::placeholder { color: rgba(255,255,255,0.6); }
  .chat-input-row .send {
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.35);
    color: #ffffff;
    border-radius: 999px;
    padding: 14px 22px;
    font-size: 16px;
    cursor: pointer;
  }
  .chat-input-row .send:hover { background: rgba(255,255,255,0.24); }
</style>
</head>

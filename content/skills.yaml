    escalation, and protecting delivery commitments across GE's TCS account
    through structured account-level escalation management.
- name: Project Recovery & Turnaround
  evidence:
    - tcs-bcp
  summary: >-
    Jose recovers distressed programs from the ground up — taking over
    Banco de Crédito del Perú's first TCS-led software-development
    engagement with an unbaselined scope and an incomplete Statement of
    Work, then rebuilding governance and scope to close all agreed
    milestones within about a year.

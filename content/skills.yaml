- name: Service Recovery & Incident Management
  evidence:
    - tcs-banamex
    - tcs-ge
  summary: >-
    Jose rebuilds trust after service breakdowns — reducing a Citibanamex
    client's average Priority 1 incident resolution time by roughly 97%
